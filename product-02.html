<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphic Tee #02 — YOUR BRAND</title>

  <style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #f4f4f4;
  color: #111;
}

header {
  background: #111;
  color: white;
  padding: 18px 7%;
}

.logo {
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 3px;
}

.product-page {
  max-width: 1100px;
  margin: 50px auto;
  padding: 0 7%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 50px;
  align-items: start;
}

.product-image {
  height: 520px;
  background: #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 90px;
}

.status {
  display: inline-block;
  font-size: 11px;
  background: #111;
  color: white;
  padding: 6px 10px;
  margin-bottom: 15px;
  letter-spacing: 1px;
}

.product-page h1 {
  font-size: 38px;
  margin-bottom: 10px;
}

.price {
  font-weight: bold;
  font-size: 22px;
  margin: 15px 0 30px;
}

.label {
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1.5px;
  margin: 22px 0 10px;
}

.sizes {
  display: flex;
  gap: 8px;
}

.size {
  width: 50px;
  height: 42px;
  background: white;
  border: 1px solid #ccc;
  cursor: pointer;
  font-weight: bold;
}

.size:hover {
  background: #111;
  color: white;
}

.quantity {
  display: flex;
  align-items: center;
  gap: 20px;
}

.quantity button {
  width: 38px;
  height: 38px;
  background: white;
  border: 1px solid #ccc;
  cursor: pointer;
  font-size: 18px;
}

.quantity strong {
  min-width: 20px;
  text-align: center;
}

.info {
  background: white;
  padding: 18px;
  line-height: 1.8;
  color: #555;
  font-size: 14px;
}
/* DATA PEMBELI */

.customer-form {
  margin-top: 24px;
  padding: 18px;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 10px;
}

.customer-form h2 {
  margin: 0 0 18px;
  color: #111;
  font-size: 16px;
  letter-spacing: 1px;
}

.form-group {
  margin-bottom: 13px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  color: #333;
  font-size: 12px;
  font-weight: 600;
}

.form-group label span {
  color: #999;
  font-weight: 400;
}

.customer-form input,
.customer-form textarea {
  width: 100%;
  padding: 11px 12px;
  background: #fafafa;
  color: #111;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-family: inherit;
  font-size: 13px;
  outline: none;
}

.customer-form input::placeholder,
.customer-form textarea::placeholder {
  color: #aaa;
}

.customer-form input:focus,
.customer-form textarea:focus {
  background: #fff;
  border-color: #111;
}

.customer-form textarea {
  min-height: 65px;
  resize: vertical;
}

.customer-form + button {
  width: 100%;
  margin-top: 12px;
  padding: 15px;
  background: #111;
  color: #fff;
  border: none;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
}

.customer-form + button:hover {
  background: #333;
}
@media (max-width: 700px) {
  .product-page {
    grid-template-columns: 1fr;
    margin: 30px auto;
    gap: 30px;
  }

  .product-image {
    height: 350px;
  }

  .product-page h1 {
    font-size: 30px;
  }
}   
  </style>
</head>

<body>

<header>
  <div class="logo">YOUR BRAND</div>
</header>


<main class="product-page">

  <div class="product-image">
    👕
  </div>

  <div>

    <span class="status">OPEN PO</span>

    <h1>Graphic Tee #02</h1>

    <div class="price">Rp0</div>

    <div class="label">SIZE</div>

    <div class="sizes">
      <button class="size" onclick="selectSize('S')">S</button>
      <button class="size" onclick="selectSize('M')">M</button>
      <button class="size" onclick="selectSize('L')">L</button>
      <button class="size" onclick="selectSize('XL')">XL</button>
    </div>

    <div class="label">JUMLAH</div>

    <div class="quantity">
      <button onclick="changeQty(-1)">−</button>
      <strong id="qty">1</strong>
      <button onclick="changeQty(1)">+</button>
    </div>

    <div class="label">DETAIL</div>

    <div class="info">
      Material: [ISI MATERIAL]<br>
      Size: [ISI UKURAN]<br>
      Estimasi produksi: [ISI ESTIMASI PRODUKSI]
    </div>

<div class="customer-form">
  <h2>DATA PEMBELI</h2>

  <div class="form-group">
    <label for="nama">Nama Lengkap</label>
    <input type="text" id="nama" placeholder="Masukkan nama lengkap">
  </div>

  <div class="form-group">
    <label for="wa">Nomor WhatsApp</label>
    <input type="tel" id="wa" placeholder="08xxxxxxxxxx">
  </div>

  <div class="form-group">
    <label for="alamat">Alamat Lengkap</label>
    <textarea id="alamat" placeholder="Nama jalan, nomor rumah, RT/RW"></textarea>
  </div>

  <div class="form-group">
    <label for="kota">Kota / Kabupaten</label>
    <input type="text" id="kota" placeholder="Contoh: Tangerang">
  </div>

  <div class="form-group">
    <label for="kodepos">Kode Pos</label>
    <input type="text" id="kodepos" placeholder="Contoh: 15154">
  </div>

  <div class="form-group">
    <label for="catatan">Catatan <span>(Opsional)</span></label>
    <textarea id="catatan" placeholder="Tambahkan catatan jika diperlukan"></textarea>
  </div>
</div>

<button onclick="order()">PRE-ORDER SEKARANG</button>
  </div>

</main>

<script>
let size = "";
let qty = 1;

function selectSize(value) {
  size = value;
}

function changeQty(value) {
  qty += value;

  if (qty < 1) {
    qty = 1;
  }

  document.getElementById("qty").textContent = qty;
}
// ===== FUNCTION ORDER DESIGN 02 =====

function order() {
  if (!size) {
    alert("Pilih ukuran terlebih dahulu.");
    return;
  }

  const nama = document.getElementById("nama").value.trim();
  const wa = document.getElementById("wa").value.trim();
  const alamat = document.getElementById("alamat").value.trim();
  const kota = document.getElementById("kota").value.trim();
  const kodepos = document.getElementById("kodepos").value.trim();
  const catatan = document.getElementById("catatan").value.trim();

  if (!nama || !wa || !alamat || !kota || !kodepos) {
    alert("Lengkapi data pembeli terlebih dahulu.");
    return;
  }

  const product = "Graphic Tee #02";
  const price = 0;
  const total = price * qty;

  const now = new Date();
  const date =
    now.getFullYear().toString() +
    String(now.getMonth() + 1).padStart(2, "0") +
    String(now.getDate()).padStart(2, "0");

  const invoiceNumber =
    "INV-" + date + "-" + Math.floor(100 + Math.random() * 900);

  const message =
`Halo, saya mau pre-order.

No. Invoice: ${invoiceNumber}

Produk: ${product}
Size: ${size}
Jumlah: ${qty}
Harga: Rp${price.toLocaleString("id-ID")}
Total: Rp${total.toLocaleString("id-ID")}

DATA PEMBELI
Nama: ${nama}
WhatsApp: ${wa}
Alamat: ${alamat}
Kota/Kabupaten: ${kota}
Kode Pos: ${kodepos}
Catatan: ${catatan || "-"}

STATUS
MENUNGGU PEMBAYARAN`;

  const invoice = `
    <div id="invoicePage" class="invoice-page">
      <div class="invoice-header">
        <div>
          <div class="invoice-brand">YOUR BRAND</div>
          <div class="invoice-subtitle">PRE-ORDER INVOICE</div>
        </div>
        <div class="invoice-number">
          <span>NO. INVOICE</span>
          <strong>${invoiceNumber}</strong>
        </div>
      </div>

      <div class="invoice-section">
        <h3>INFORMASI PEMBELI</h3>
        <div class="invoice-grid">
          <div><span>Nama</span><strong>${nama}</strong></div>
          <div><span>WhatsApp</span><strong>${wa}</strong></div>
          <div class="full"><span>Alamat</span><strong>${alamat}</strong></div>
          <div><span>Kota / Kabupaten</span><strong>${kota}</strong></div>
          <div><span>Kode Pos</span><strong>${kodepos}</strong></div>
        </div>
      </div>

      <div class="invoice-section">
        <h3>DETAIL PESANAN</h3>
        <div class="order-card">
          <div class="order-product">
            <div class="order-thumb">👕</div>
            <div>
              <strong>${product}</strong>
              <span>OPEN PO</span>
            </div>
          </div>
          <div class="order-row"><span>Size</span><strong>${size}</strong></div>
          <div class="order-row"><span>Jumlah</span><strong>${qty}</strong></div>
          <div class="order-row"><span>Harga Satuan</span><strong>Rp${price.toLocaleString("id-ID")}</strong></div>
        </div>
      </div>

      <div class="invoice-section">
        <h3>RINGKASAN PEMBAYARAN</h3>
        <div class="payment-row"><span>Subtotal</span><strong>Rp${total.toLocaleString("id-ID")}</strong></div>
        <div class="payment-row"><span>Ongkir</span><strong>Menyesuaikan</strong></div>
        <div class="payment-total"><span>TOTAL</span><strong>Rp${total.toLocaleString("id-ID")}</strong></div>
      </div>

      <div class="invoice-section">
        <h3>PEMBAYARAN</h3>
        <div class="payment-box">
          <div><span>Metode Pembayaran</span><strong>Informasi pembayaran akan diberikan melalui WhatsApp</strong></div>
          <div><span>Status</span><strong class="status-waiting">MENUNGGU PEMBAYARAN</strong></div>
        </div>
      </div>

      <div class="invoice-section">
        <h3>CATATAN</h3>
        <div class="note-box">${catatan || "-"}</div>
      </div>

      <div class="invoice-footer">
        <strong>TERIMA KASIH SUDAH MELAKUKAN PRE-ORDER</strong>
        <span>Invoice ini dibuat secara otomatis oleh YOUR BRAND.</span>
      </div>

      <div class="invoice-actions">
        <button id="pdfButton">DOWNLOAD INVOICE PDF</button>
        <button id="waButton">KIRIM INVOICE KE WHATSAPP</button>
      </div>
    </div>
  `;

  const invoiceStyle = `
    <style id="invoiceStyle">
      body {
        background:#f1f1f1;
        margin:0;
        color:#111;
        font-family:Arial,sans-serif;
      }

      .invoice-page {
        max-width:760px;
        margin:30px auto;
        background:#fff;
        padding:42px;
        box-sizing:border-box;
        border:1px solid #ddd;
      }

      .invoice-header {
        display:flex;
        justify-content:space-between;
        align-items:flex-start;
        padding-bottom:25px;
        border-bottom:2px solid #111;
      }

      .invoice-brand {
        font-size:25px;
        font-weight:800;
        letter-spacing:3px;
      }

      .invoice-subtitle {
        margin-top:7px;
        color:#777;
        font-size:11px;
        letter-spacing:1.5px;
      }

      .invoice-number {
        text-align:right;
        font-size:11px;
      }

      .invoice-number span,
      .invoice-grid span,
      .order-row span,
      .payment-row span,
      .payment-box span {
        display:block;
        color:#777;
        font-size:10px;
        text-transform:uppercase;
        letter-spacing:.7px;
      }

      .invoice-number strong {
        display:block;
        margin-top:5px;
        font-size:13px;
      }

      .invoice-section {
        margin-top:28px;
      }

      .invoice-section h3 {
        margin:0 0 12px;
        font-size:11px;
        letter-spacing:1.5px;
      }

      .invoice-grid {
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:12px 25px;
        padding:16px;
        background:#f7f7f7;
      }

      .invoice-grid .full {
        grid-column:1 / -1;
      }

      .invoice-grid strong {
        display:block;
        margin-top:4px;
        font-size:13px;
        font-weight:600;
      }

      .order-card {
        border:1px solid #ddd;
      }

      .order-product {
        display:flex;
        align-items:center;
        gap:14px;
        padding:16px;
        background:#f7f7f7;
      }

      .order-thumb {
        width:58px;
        height:58px;
        display:flex;
        align-items:center;
        justify-content:center;
        background:#ddd;
        font-size:27px;
      }

      .order-product strong {
        display:block;
        font-size:14px;
      }

      .order-product span {
        display:block;
        margin-top:5px;
        font-size:10px;
        color:#777;
        letter-spacing:1px;
      }

      .order-row,
      .payment-row,
      .payment-total {
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:12px 16px;
        border-top:1px solid #eee;
      }

      .order-row strong,
      .payment-row strong {
        font-size:13px;
      }

      .payment-total {
        margin-top:6px;
        padding:18px 16px;
        background:#111;
        color:#fff;
      }

      .payment-total span {
        font-size:11px;
        letter-spacing:1px;
      }

      .payment-total strong {
        font-size:20px;
      }

      .payment-box {
        display:grid;
        gap:15px;
        padding:16px;
        background:#f7f7f7;
      }

      .payment-box strong {
        display:block;
        margin-top:5px;
        font-size:13px;
      }

      .status-waiting {
        letter-spacing:1px;
      }

      .note-box {
        padding:15px;
        min-height:25px;
        background:#f7f7f7;
        color:#555;
        font-size:13px;
      }

      .invoice-footer {
        display:flex;
        flex-direction:column;
        gap:6px;
        margin-top:32px;
        padding-top:20px;
        border-top:1px solid #ddd;
        font-size:10px;
        color:#777;
      }

      .invoice-footer strong {
        color:#111;
        letter-spacing:1px;
      }

      .invoice-actions {
        display:grid;
        gap:10px;
        margin-top:28px;
      }

      .invoice-actions button {
        width:100%;
        padding:15px;
        border:0;
        background:#111;
        color:#fff;
        font-size:12px;
        font-weight:700;
        letter-spacing:1px;
        cursor:pointer;
      }

      .invoice-actions button + button {
        background:#fff;
        color:#111;
        border:1px solid #111;
      }

      @media (max-width:700px) {
        .invoice-page {
          margin:0;
          padding:24px 18px;
          border:0;
        }

        .invoice-header {
          gap:18px;
          flex-direction:column;
        }

        .invoice-number {
          text-align:left;
        }

        .invoice-grid {
          grid-template-columns:1fr;
        }

        .invoice-grid .full {
          grid-column:auto;
        }
      }

      @media print {
        body { background:#fff; }
        .invoice-page {
          max-width:none;
          margin:0;
          border:0;
          padding:0;
        }
        .invoice-actions { display:none !important; }
      }
    </style>
  `;

  document.body.innerHTML = invoiceStyle + invoice;

  document.getElementById("waButton").onclick = function() {
    window.location.href =
      "https://wa.me/628999878277?text=" +
      encodeURIComponent(message);
  };

  document.getElementById("pdfButton").onclick = function() {
    const html = document.documentElement.outerHTML;
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = invoiceNumber + ".html";
    a.click();

    URL.revokeObjectURL(url);
    alert("Invoice tersimpan. Untuk PDF, buka file ini lalu pilih Cetak > Simpan sebagai PDF.");
  };
}

</script>

</body>
</html>
